<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud enviada · Finanzas Claras</title>
  <link rel="icon" href="/static/core/branding/finanzas-claras-icon.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
  <style>
    :root { --bg:#f5f6fa; --surface:#fff; --text:#1b2431; --muted:#687588; --line:#e8ebf1; --primary:#25a194; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; background:var(--bg); color:var(--text); font:14px Inter,sans-serif; }
    .panel { width:min(100%,480px); padding:32px; border:1px solid var(--line); border-top:3px solid var(--primary); border-radius:14px; background:var(--surface); box-shadow:0 18px 50px rgba(15,23,42,.08); text-align:center; }
    .brand-logo { display:block; width:min(100%,260px); height:auto; margin:0 auto 20px; }
    .icon { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 18px; border-radius:50%; background:#e6f7f5; color:var(--primary); }
    .icon span { font-size:32px; }
    h1 { margin:0 0 10px; font-size:24px; }
    p { margin:0 0 22px; color:var(--muted); line-height:1.6; }
    a { display:inline-flex; min-height:42px; align-items:center; padding:0 18px; border-radius:9px; background:var(--primary); color:#fff; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main class="panel">
    <img class="brand-logo" src="/static/core/branding/finanzas-claras-logo.png" alt="Finanzas Claras">
    <div class="icon"><span class="material-symbols-outlined">mark_email_read</span></div>
    <h1>Solicitud enviada</h1>
    <p>Tu cuenta está pendiente de autorización. Cuando un administrador la apruebe, recibirás un correo y podrás iniciar sesión.</p>
    <a href="{% url 'login' %}">Volver al inicio de sesión</a>
  </main>
</body>
</html>
