<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · TaskBudget</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root { --bg:#f8fafc; --surface:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --primary:#25a194; --danger:#dc2626; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:14px Inter,sans-serif; }
    .box { width:min(100%,430px); }
    .brand { display:block; margin-bottom:18px; color:var(--text); font-size:19px; font-weight:800; text-align:center; text-decoration:none; }
    .panel { padding:26px; border:1px solid var(--line); border-top:3px solid var(--primary); border-radius:13px; background:var(--surface); box-shadow:0 18px 50px rgba(15,23,42,.08); }
    h1 { margin:0; font-size:23px; text-align:center; }
    p { color:var(--muted); line-height:1.55; text-align:center; }
    label { display:block; margin:18px 0 7px; font-weight:700; }
    input { width:100%; min-height:46px; padding:10px 13px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; }
    input:focus { outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,161,148,.13); }
    .errorlist { color:var(--danger); padding-left:20px; }
    button { width:100%; min-height:44px; margin-top:18px; border:0; border-radius:9px; background:var(--primary); color:#fff; cursor:pointer; font:700 14px Inter,sans-serif; }
    .back { display:block; margin-top:16px; color:var(--primary); text-align:center; }
  </style>
</head>
<body>
  <main class="box">
    <a class="brand" href="{% url 'login' %}">TaskBudget</a>
    <section class="panel">
      <h1>Recuperar contraseña</h1>
      <p>Escribe el correo asociado a tu cuenta. Si existe una cuenta activa, enviaremos un enlace seguro para crear una contraseña nueva.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <label for="{{ form.email.id_for_label }}">Correo electrónico</label>
        {{ form.email }}
        <button type="submit">Enviar enlace de recuperación</button>
      </form>
      <a class="back" href="{% url 'login' %}">Volver a iniciar sesión</a>
    </section>
  </main>
</body>
</html>
