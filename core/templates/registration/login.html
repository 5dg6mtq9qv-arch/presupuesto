<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Gestor de Finanzas Personales</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --danger: #dc2626;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 18px 50px rgba(15, 23, 42, .08);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .login-box { width: min(100% - 32px, 390px); }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--primary);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .panel h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
    }
    .panel p {
      margin: 8px 0 20px;
      color: var(--muted);
      text-align: center;
    }
    .unfold-field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      color: #374151;
      font-size: 13px;
      font-weight: 650;
    }
    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      padding: 9px 12px;
      outline: 0;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    .btn {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--primary);
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .material-symbols-outlined { font-size: 22px; line-height: 1; }
    .alert {
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fef2f2;
      color: var(--danger);
      margin-bottom: 14px;
      padding: 10px 12px;
    }
    .actions { display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="login-box">
    <a class="brand" href="{% url 'login' %}">
      <span class="brand-mark">GFP</span>
      <span>Gestor de Finanzas Personales</span>
    </a>

    <section class="panel">
      <h1>Ingresar</h1>
      <p>Accede a tu agenda y finanzas personales.</p>

      {% if form.errors %}
        <div class="alert">Usuario o contraseña incorrectos.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        {% include "core/includes/unfold_form_fields.html" %}
        <div class="actions">
          <button class="btn" type="submit" title="Entrar" aria-label="Entrar">
            <span class="material-symbols-outlined">login</span>
          </button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
