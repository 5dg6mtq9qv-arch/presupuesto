{% extends "base.html" %}

{% block content %}
<section class="panel">
  <h1>Ingresar</h1>
  {% if form.errors %}
    <p class="muted">Usuario o contrasena incorrectos.</p>
  {% endif %}
  <form class="fields" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button type="submit">Entrar</button>
      <a class="button secondary" href="{% url 'admin:index' %}">Admin</a>
    </div>
  </form>
</section>
{% endblock %}
