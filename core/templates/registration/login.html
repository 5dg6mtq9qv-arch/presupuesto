{% extends "base.html" %}

{% block page_title %}Ingresar{% endblock %}
{% block page_subtitle %}Usa tu usuario asignado por el administrador{% endblock %}

{% block content %}
<section class="panel">
  {% if form.errors %}
    <div class="alert alert-danger">Usuario o contrasena incorrectos.</div>
  {% endif %}
  <form class="form-grid" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions actions">
      <button class="btn btn-primary" type="submit">Entrar</button>
      <a class="btn btn-outline-primary" href="{% url 'admin:index' %}">Admin</a>
    </div>
  </form>
</section>
{% endblock %}
