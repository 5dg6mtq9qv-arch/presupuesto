<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · TaskBudget</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <style>
    .login-logo .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: inline-grid;
      place-items: center;
      margin-right: .5rem;
      background: linear-gradient(135deg, #16a34a, #2563eb);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      vertical-align: .2rem;
    }

    .login-card-body {
      border-top: 3px solid #007bff;
    }

    form p {
      margin-bottom: 1rem;
    }

    form p label {
      display: block;
      margin-bottom: .35rem;
      color: #343a40;
      font-size: .8125rem;
      font-weight: 700;
    }

    form p input {
      display: block;
      width: 100%;
      height: calc(2.25rem + 2px);
      padding: .375rem .75rem;
      color: #495057;
      background-color: #ffffff;
      border: 1px solid #ced4da;
      border-radius: .25rem;
    }

    .btn-icon {
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
  </style>
</head>
<body class="hold-transition login-page">
  <div class="login-box">
    <div class="login-logo">
      <a href="{% url 'login' %}">
        <span class="brand-mark">TB</span><b>Task</b>Budget
      </a>
    </div>

    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Ingresa para iniciar sesion</p>

        {% if form.errors %}
          <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary btn-icon" type="submit" title="Entrar" aria-label="Entrar">
            <i class="fas fa-sign-in-alt"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
