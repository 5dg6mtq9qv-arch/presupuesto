<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · TaskBudget</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .login-card {
      width: min(100% - 32px, 390px);
      background: #ffffff;
      border: 1px solid #e1e7ef;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .08);
      padding: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      font-weight: 800;
      font-size: 22px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #14a66b, #2563eb);
      font-weight: 900;
    }

    label {
      color: #344054;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #e1e7ef;
      border-radius: 14px;
      padding: 10px 13px;
      outline: none;
    }

    input:focus {
      border-color: #14a66b;
      box-shadow: 0 0 0 .2rem rgba(20, 166, 107, .14);
    }

    form p {
      margin-bottom: 14px;
    }

    .btn-primary {
      width: 100%;
      min-height: 44px;
      border-radius: 14px;
      border: 0;
      font-weight: 800;
      background: linear-gradient(135deg, #14a66b, #2563eb);
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <span class="brand-mark">TB</span>
      <span>TaskBudget</span>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
