<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cuenta{% endblock %} · TaskBudget</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root { --bg:#f8fafc; --surface:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --primary:#25a194; --danger:#dc2626; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:14px Inter,sans-serif; }
    .box { width:min(100%,460px); }
    .brand { display:block; margin-bottom:18px; color:var(--text); font-size:19px; font-weight:800; text-align:center; text-decoration:none; }
    .panel { padding:26px; border:1px solid var(--line); border-top:3px solid var(--primary); border-radius:13px; background:var(--surface); box-shadow:0 18px 50px rgba(15,23,42,.08); }
    h1 { margin:0 0 12px; font-size:23px; text-align:center; }
    p { color:var(--muted); line-height:1.55; text-align:center; }
    label { display:block; margin:16px 0 7px; font-weight:700; }
    input { width:100%; min-height:46px; padding:10px 13px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; }
    input:focus { outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,161,148,.13); }
    .help { margin-top:6px; color:var(--muted); font-size:12px; line-height:1.4; }
    .help ul { margin:6px 0; padding-left:18px; }
    .errorlist { color:var(--danger); padding-left:20px; }
    button, .button { display:block; width:100%; min-height:44px; margin-top:18px; padding:12px; border:0; border-radius:9px; background:var(--primary); color:#fff; cursor:pointer; font:700 14px Inter,sans-serif; text-align:center; text-decoration:none; }
  </style>
</head>
<body>
  <main class="box">
    <a class="brand" href="{% url 'login' %}">TaskBudget</a>
    <section class="panel">
      <h1>{% block heading %}{% endblock %}</h1>
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
