{% extends "base.html" %}

{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Controla saldo, vencimiento y estado de cada deuda{% endblock %}

{% block content %}
<section class="panel">
  <form class="form-grid" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions actions">
      <button class="btn btn-primary btn-icon" type="submit" title="Guardar" aria-label="Guardar">
        <i class="fas fa-save"></i>
      </button>
      <a class="btn btn-outline-secondary btn-icon" href="{% url 'deuda_list' %}" title="Cancelar" aria-label="Cancelar">
        <i class="fas fa-times"></i>
      </a>
    </div>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
  (() => {
    const fechaInicioInput = document.getElementById("id_fecha_inicio");
    const cuotasInput = document.getElementById("id_numero_cuotas");
    const fechaVencimientoInput = document.getElementById("id_fecha_vencimiento");

    if (!fechaInicioInput || !cuotasInput || !fechaVencimientoInput) {
      return;
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function addMonths(date, months) {
      const result = new Date(date.getTime());
      const originalDay = result.getDate();
      result.setMonth(result.getMonth() + months);

      if (result.getDate() !== originalDay) {
        result.setDate(0);
      }

      return result;
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function updateFechaVencimiento() {
      const fechaInicio = fechaInicioInput.value;
      const cuotas = Number.parseInt(cuotasInput.value, 10);

      if (!fechaInicio || !Number.isFinite(cuotas) || cuotas < 1) {
        fechaVencimientoInput.value = "";
        return;
      }

      const [year, month, day] = fechaInicio.split("-").map(Number);
      const startDate = new Date(year, month - 1, day);
      fechaVencimientoInput.value = formatDate(addMonths(startDate, cuotas));
    }

    fechaInicioInput.addEventListener("change", updateFechaVencimiento);
    cuotasInput.addEventListener("input", updateFechaVencimiento);
    updateFechaVencimiento();
  })();
</script>
{% endblock %}
