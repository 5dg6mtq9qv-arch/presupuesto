{% extends "base.html" %}

{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Crea usuarios y controla si pueden acceder al sistema{% endblock %}

{% block content %}
<section class="panel">
  <form class="form-grid" method="post">
    {% csrf_token %}
    {% include "core/includes/unfold_form_fields.html" %}
    <div class="form-actions actions">
      <button class="btn btn-primary btn-icon" type="submit" title="Guardar" aria-label="Guardar">
        <span class="material-symbols-outlined">save</span>
      </button>
      <a class="btn btn-outline-secondary btn-icon" href="{% url 'usuario_list' %}" title="Cancelar" aria-label="Cancelar">
        <span class="material-symbols-outlined">close</span>
      </a>
    </div>
  </form>
</section>
{% endblock %}
