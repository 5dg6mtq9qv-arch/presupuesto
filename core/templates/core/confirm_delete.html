{% extends "base.html" %}

{% block page_title %}Eliminar registro{% endblock %}
{% block page_subtitle %}Confirma la accion antes de continuar{% endblock %}

{% block content %}
<section class="panel">
  <p>Vas a eliminar: <strong>{{ object }}</strong></p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="btn btn-danger" type="submit">Eliminar</button>
      <a class="btn btn-outline-primary" href="{% url back_url %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
