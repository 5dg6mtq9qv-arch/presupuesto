{% extends "base.html" %}

{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Registra ingresos y gastos por categoria{% endblock %}

{% block content %}
<section class="panel">
  <form class="form-grid" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions actions">
      <button class="btn btn-primary btn-icon" type="submit" title="Guardar" aria-label="Guardar">
        <i class="fas fa-save"></i>
      </button>
      <a class="btn btn-outline-secondary btn-icon" href="{% url 'movimiento_list' %}" title="Cancelar" aria-label="Cancelar">
        <i class="fas fa-times"></i>
      </a>
    </div>
  </form>
</section>
{% endblock %}
