{% extends "base.html" %}

{% block content %}
<section class="panel">
  <h1>{{ title }}</h1>
  <form class="fields" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button type="submit">Guardar</button>
      <a class="button secondary" href="{% url 'tarea_list' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
