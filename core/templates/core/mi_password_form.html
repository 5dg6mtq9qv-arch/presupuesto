{% extends "base.html" %}

{% block page_title %}Cambiar mi contraseña{% endblock %}
{% block page_subtitle %}Confirma tu contraseña actual y elige una nueva{% endblock %}

{% block content %}
<section class="panel form-panel">
  <form class="form-grid" method="post">
    {% csrf_token %}
    {% include "core/includes/unfold_form_fields.html" %}
    <div class="form-actions actions">
      <button class="btn btn-primary" type="submit">
        <span class="material-symbols-outlined">key</span>
        <span>Actualizar mi contraseña</span>
      </button>
      <a class="btn btn-outline-secondary" href="{% url 'perfil_update' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
