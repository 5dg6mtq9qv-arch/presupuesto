{% extends "base.html" %}

{% block page_title %}Cambiar contraseña{% endblock %}
{% block page_subtitle %}Usuario: {{ usuario.username }}{% endblock %}

{% block content %}
<section class="panel">
  <form class="form-grid" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions actions">
      <button class="btn btn-primary" type="submit">Actualizar contraseña</button>
      <a class="btn btn-outline-primary" href="{% url 'usuario_list' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
