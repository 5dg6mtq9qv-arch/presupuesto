{% extends "base.html" %}

{% block page_title %}Cambiar contraseña{% endblock %}
{% block page_subtitle %}Usuario: {{ usuario.username }}{% endblock %}

{% block content %}
<section class="panel">
  <form class="form-grid" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions actions">
      <button class="btn btn-primary btn-icon" type="submit" title="Actualizar contraseña" aria-label="Actualizar contraseña">
        <i class="fas fa-save"></i>
      </button>
      <a class="btn btn-outline-secondary btn-icon" href="{% url 'usuario_list' %}" title="Cancelar" aria-label="Cancelar">
        <i class="fas fa-times"></i>
      </a>
    </div>
  </form>
</section>
{% endblock %}
